[project]
name = "livetest"
version = "0.1.0"
description = "End-to-end tests for any LiveKit agent, from just a token"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    # openai: the tester's LLM, STT and TTS (any OpenAI-compatible server); the VAD is livekit-agents' own.
    "livekit-agents[openai]==1.7.1",
    "python-dotenv==1.2.3",
    # Imported directly by livetest/runtime/models.py; already pulled in by livekit-agents.
    "pydantic==2.14.3",
    # Everything they pull in, pinned too: `uv tool install` ignores uv.lock, so a user would get the newest versions
    # that fit. To upgrade: delete this block, `uv lock --upgrade`, then paste back
    # `uv export --no-dev --no-hashes --no-emit-project --no-header` minus the three above.
    "aiofiles==25.1.0",
    "aiohappyeyeballs==2.7.1",
    "aiohttp==3.14.5",
    "aiosignal==1.4.0",
    "annotated-doc==0.0.5",
    "annotated-types==0.8.0",
    "anyio==4.16.0",
    "attrs==26.1.0",
    "av==19.0.2",
    "certifi==2026.10.23",
    "cffi==2.1.1",
    "charset-normalizer==3.5.2",
    "click==8.5.0",
    "colorama==0.4.6",
    "distro==1.9.0",
    "docstring-parser==0.18.0",
    "eval-type-backport==0.4.0",
    "frozenlist==1.8.0",
    "googleapis-common-protos==1.76.0",
    "grpcio==1.85.1",
    "h11==0.16.0",
    "httpcore==1.0.9",
    "httpx==0.28.1",
    "idna==3.20",
    "importlib-metadata==8.7.1",
    "jiter==0.18.0",
    "json-repair==0.60.1",
    "livekit==1.1.15",
    "livekit-api==1.2.2",
    "livekit-blingfire==1.2.0",
    "livekit-local-inference==0.2.7",
    "livekit-plugins-openai==1.7.1",
    "livekit-protocol==1.1.31",
    "markdown-it-py==4.2.0",
    "mdurl==0.1.2",
    "multidict==7.2.1",
    "nest-asyncio==1.6.0",
    "numpy==2.5.4",
    "openai==2.54.0",
    "opentelemetry-api==1.39.1",
    "opentelemetry-exporter-otlp==1.39.1",
    "opentelemetry-exporter-otlp-proto-common==1.39.1",
    "opentelemetry-exporter-otlp-proto-grpc==1.39.1",
    "opentelemetry-exporter-otlp-proto-http==1.39.1",
    "opentelemetry-proto==1.39.1",
    "opentelemetry-sdk==1.39.1",
    "opentelemetry-semantic-conventions==0.60b1",
    "pillow==13.0.0",
    "prometheus-client==0.26.0",
    "propcache==0.5.4",
    "protobuf==6.33.6",
    "psutil==7.2.2",
    "pycparser==3.12 ; implementation_name != 'PyPy'",
    "pydantic-core==2.50.4",
    "pygments==2.21.0",
    "pyjwt==2.15.1",
    "pyyaml==6.0.3",
    "requests==2.34.2",
    "rich==15.0.0",
    "shellingham==1.5.4",
    "sniffio==1.3.1",
    "sounddevice==0.5.6",
    "tqdm==4.70.1",
    "typer==0.27.3",
    "types-protobuf==7.35.1.20260906",
    "typing-extensions==4.16.0",
    "typing-inspection==0.4.5",
    "urllib3==2.8.0",
    "watchfiles==1.3.0",
    "websockets==15.0.1",
    "yarl==1.25.1",
    "zipp==4.1.2",
]

# `livetest` on the PATH: `uv run livetest` here, `uv tool install` for users.
[project.scripts]
livetest = "livetest.cli:main"

[build-system]
requires = ["uv_build>=0.12,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""  # package is ./livetest, not ./src/livetest

[dependency-groups]
dev = [
    "pytest==9.2.0",
]
