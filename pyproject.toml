[project]
name = "livetest"
version = "0.1.0"
description = "End-to-end tests for any LiveKit agent, from just a token"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "livekit-agents[silero,deepgram,groq,elevenlabs]==1.7.1",
    "python-dotenv==1.2.3",
    # Imported directly by telemetry.py; already pulled in by livekit-agents.
    "opentelemetry-sdk==1.39.1",
    "opentelemetry-exporter-otlp-proto-http==1.39.1",
    # Imported directly by livetest/models.py; already pulled in by livekit-agents.
    "pydantic==2.14.3",
]

# `livetest` on the PATH: `uv run livetest` here, `uv tool install` for users.
[project.scripts]
livetest = "livetest.cli:main"

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""  # package is ./livetest, not ./src/livetest

[dependency-groups]
dev = [
    "pytest==9.2.0",
]
